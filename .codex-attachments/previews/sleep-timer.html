<style>
  #velune-timer-preview { display:grid; place-items:center; padding:18px 0; }
  #velune-timer-preview .vt-screen { --vt-accent:#d1d591; position:relative; isolation:isolate; width:100%; max-width:390px; height:660px; overflow:hidden; border-radius:28px; background:#000; color:#eee; font-family:Roboto,Arial,sans-serif; box-shadow:0 12px 36px #0003; }
  #velune-timer-preview .vt-player { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center bottom; }
  #velune-timer-preview button { font-family:inherit; font-weight:500; font-size:14px; cursor:var(--cursor-interaction,pointer); -webkit-tap-highlight-color:transparent; }
  #velune-timer-preview button:focus-visible, #velune-timer-preview input:focus-visible { outline:2px solid var(--vt-accent); outline-offset:3px; }
  #velune-timer-preview .vt-launch { position:absolute; bottom:0; left:calc(50% - 32px); width:64px; height:56px; border:0; border-radius:22px; background:transparent; }
  #velune-timer-preview .vt-scrim { position:absolute; inset:0; z-index:2; width:100%; height:100%; border:0; background:#0009; opacity:1; transition:opacity 240ms ease; }
  #velune-timer-preview .vt-sheet { position:absolute; z-index:3; inset:auto 0 0; background:#191919; border-radius:30px 30px 0 0; transform:translateY(0); transition:transform 320ms cubic-bezier(.2,.8,.2,1); }
  #velune-timer-preview .vt-handle-button { display:grid; place-items:center; width:100%; height:40px; border:0; background:transparent; touch-action:none; }
  #velune-timer-preview .vt-handle-button span { width:34px; height:4px; border-radius:3px; background:#777; }
  #velune-timer-preview .vt-content { padding:0 24px 18px; }
  #velune-timer-preview h2 { margin:0; font-size:24px; font-weight:400; line-height:1.4; }
  #velune-timer-preview .vt-duration { position:relative; display:grid; place-items:center; min-height:54px; margin:24px 0 14px; font-size:32px; font-weight:400; font-variant-numeric:tabular-nums; line-height:1.3; }
  #velune-timer-preview .vt-old { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
  #velune-timer-preview .vt-current { display:block; white-space:nowrap; }
  #velune-timer-preview .vt-slider { position:relative; height:56px; }
  #velune-timer-preview .vt-track { position:absolute; top:22px; left:24px; right:24px; height:12px; border-radius:8px; background:#36372c; overflow:hidden; }
  #velune-timer-preview .vt-fill { display:block; width:21.739%; height:100%; background:var(--vt-accent); border-radius:inherit; }
  #velune-timer-preview .vt-end-dot { position:absolute; right:4px; top:4px; width:4px; height:4px; background:var(--vt-accent); border-radius:50%; }
  #velune-timer-preview .vt-thumb { position:absolute; z-index:1; left:calc(24px + (100% - 48px)*.21739); top:12px; width:32px; height:32px; margin-left:-16px; border-radius:50%; color:#272911; background:var(--vt-accent); pointer-events:none; transform:scale(1); transition:transform 200ms ease; }
  #velune-timer-preview .vt-thumb::before { content:""; position:absolute; inset:-8px; border-radius:50%; background:var(--vt-accent); opacity:0; transform:scale(.8); transition:opacity 180ms ease,transform 180ms ease; }
  #velune-timer-preview .vt-moon { position:relative; display:grid; place-items:center; width:100%; height:100%; transform:rotate(0deg); transition:transform 180ms ease; }
  #velune-timer-preview .vt-moon svg { width:20px; height:20px; stroke-width:2; }
  #velune-timer-preview .vt-slider.is-dragging .vt-thumb { transform:scale(1.12); }
  #velune-timer-preview .vt-slider.is-dragging .vt-thumb::before { opacity:.18; transform:scale(1); }
  #velune-timer-preview .vt-slider.no-glow .vt-thumb::before { opacity:0; }
  #velune-timer-preview .vt-range { position:absolute; z-index:2; inset:0; width:100%; height:56px; margin:0; appearance:none; -webkit-appearance:none; background:transparent; cursor:ew-resize; touch-action:pan-y; }
  #velune-timer-preview .vt-range::-webkit-slider-runnable-track { height:56px; background:transparent; }
  #velune-timer-preview .vt-range::-moz-range-track { height:56px; background:transparent; }
  #velune-timer-preview .vt-range::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:48px; height:48px; margin-top:4px; border:0; background:transparent; border-radius:50%; }
  #velune-timer-preview .vt-range::-moz-range-thumb { width:48px; height:48px; border:0; background:transparent; border-radius:50%; }
  #velune-timer-preview .vt-limits { display:flex; justify-content:space-between; gap:12px; margin:0 0 20px; color:#b7b7b1; font-size:12px; line-height:1.5; }
  #velune-timer-preview .vt-end-song { width:100%; min-height:44px; border:1px solid #6c6d60; border-radius:24px; color:var(--vt-accent); background:transparent; }

  #velune-timer-preview .vt-actions span { flex:1; }
  #velune-timer-preview .vt-actions button { min-height:44px; padding:0 12px; border:0; border-radius:22px; color:var(--vt-accent); background:transparent; }
  #velune-timer-preview .vt-actions .vt-ok { padding-right:8px; }

  @media (prefers-reduced-motion:reduce) { #velune-timer-preview *, #velune-timer-preview *::before { transition:none !important; } }

    const snapshot = { modelContent:{ sleepTimerMinutes:value, previewChoice:choice || 'adjusting' },
      privateContent:{ opened, accent:design.accent, halo:design.halo, tilt:design.tilt } };
    window.openai?.setWidgetState?.(snapshot)?.catch(() => {});
  }
  function paint() {
    const p = (value-5)/115;
    const width = slider.getBoundingClientRect().width;
    thumb.style.left = `${24 + Math.max(0,width-48)*p}px`;
    fill.style.width = `${p*100}%`;
    range.value = String(value);
    range.setAttribute('aria-valuetext',`${value} minutes`);
    screen.style.setProperty('--vt-accent',design.accent);
    slider.classList.toggle('no-glow',!design.halo);
    moon.style.transform = `rotate(${slider.classList.contains('is-dragging') ? ((value-62.5)/57.5)*design.tilt : 0}deg)`;
  }
  function setValue(next, animate=true) {
    const previous = value;
    value = clamp(next);
    if (value !== previous) {
      if (animate && !reduced.matches) {
        const outgoing = document.createElement('span');
        outgoing.className = 'vt-old';
        outgoing.setAttribute('aria-hidden','true');
        outgoing.textContent = `${previous} minutes`;
        duration.append(outgoing);
        const direction = value > previous ? 1 : -1;
        outgoing.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${-direction*12}px)`,opacity:0}],
          {duration:160,easing:'ease-out'}).finished.then(() => outgoing.remove(),() => outgoing.remove());
        current.getAnimations().forEach(animation => animation.cancel());
        current.animate([{transform:`translateY(${direction*12}px)`,opacity:0},{transform:'translateY(0)',opacity:1}],
          {duration:180,easing:'ease-out'});
      }
    }
    current.textContent = `${value} minutes`;
    paint();
  }
  function setOpen(next, save=true) {
    opened = Boolean(next);
    screen.classList.toggle('is-closed',!opened);
    sheet.setAttribute('aria-hidden',String(!opened));
    sheet.inert = !opened;
    root.querySelector('.vt-launch').inert = opened;
    root.querySelector('.vt-scrim').inert = !opened;
    sheet.style.transform = '';
    if (save) persist(opened ? 'opened' : 'closed');
  }
  function applySnapshot(snapshot) {
    if (!snapshot) return;
    const model = snapshot.modelContent || snapshot;
    const local = snapshot.privateContent || {};
    if (Number.isFinite(Number(model.sleepTimerMinutes))) setValue(model.sleepTimerMinutes,false);
    if (typeof local.accent === 'string' && /^#[0-9a-f]{6}$/i.test(local.accent)) design.accent = local.accent;
    if (typeof local.halo === 'boolean') design.halo = local.halo;
    if (Number.isFinite(local.tilt)) design.tilt = Math.max(0,Math.min(24,local.tilt));
    if (typeof local.opened === 'boolean') setOpen(local.opened,false);
    paint();
  }
  range.addEventListener('input',() => setValue(range.value));
  range.addEventListener('change',() => persist('duration'));
  range.addEventListener('pointerdown',() => { slider.classList.add('is-dragging'); paint(); });
  function endDrag() { slider.classList.remove('is-dragging'); paint(); }
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
  range.addEventListener('keydown',() => { slider.classList.add('is-dragging'); paint(); });
  range.addEventListener('keyup',endDrag);
  root.querySelector('.vt-reset').addEventListener('click',() => { setValue(30); persist('reset'); });
  root.querySelector('.vt-cancel').addEventListener('click',() => setOpen(false));
  root.querySelector('.vt-scrim').addEventListener('click',() => setOpen(false));
  root.querySelector('.vt-launch').addEventListener('click',() => setOpen(true));
  root.querySelector('.vt-ok').addEventListener('click',() => { setOpen(false,false); persist('duration'); });
  root.querySelector('.vt-end-song').addEventListener('click',() => { setOpen(false,false); persist('end-of-song'); });
  handle.addEventListener('click',() => { if (sheetDrag<8) setOpen(false); });
  handle.addEventListener('pointerdown',event => { downY=event.clientY; sheetDrag=0; handle.setPointerCapture(event.pointerId); });
  handle.addEventListener('pointermove',event => {
    if (downY===null) return;
    sheetDrag=Math.max(0,event.clientY-downY);
    sheet.style.transform=`translateY(${sheetDrag}px)`;
  });
  handle.addEventListener('pointerup',() => { downY=null; setOpen(sheetDrag<70); });
  handle.addEventListener('pointercancel',() => { downY=null; sheet.style.transform=''; });
  root.addEventListener('keydown',event => { if(event.key==='Escape') setOpen(false); });
  new ResizeObserver(paint).observe(slider);
  window.addEventListener('openai:set_globals',event => applySnapshot(event.detail?.globals?.widgetState));
  applySnapshot(window.openai?.widgetState);
  setOpen(opened,false);
  paint();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:screen,onChange:paint});
    tweak.addColorPicker(design,'accent',{label:'لون التطبيق',reference:'--vt-accent'});
    tweak.addToggle(design,'halo',{label:'هالة أثناء السحب'});
    tweak.addSlider(design,'tilt',{label:'ميل الهلال',min:0,max:24,step:1,unit:'°'});
  }
})();
</script>
