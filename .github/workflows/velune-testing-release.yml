name: Velune testing

on:
  push:
    branches: ["fixing-tests"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Universal Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalRelease --no-daemon

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velune testing
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Velune testing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: velune-testing-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Velune testing
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/universal/release/*.apk
