name: UI testing Debug APK

on:
  push:
    branches: ["ui-testing"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build phone Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reuse Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: velune-ui-testing-debug-keystore-v1

      - name: Build mobile Universal Debug
        run: ./gradlew :app:assembleMobileUniversalDebug --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g

      - name: Name APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobileUniversal/debug/app-mobile-universal-debug.apk "dist/Velune-ui-testing-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload installable Debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Velune-ui-testing-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add download link to build summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### Velune phone Debug\n\n[Download APK artifact](%s)\n\nCommit: `%s`\n' "$APK_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
