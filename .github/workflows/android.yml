name: Android CI

on:
  push:
    branches: ["main", "velune-offline-fixes", "Testing-features", "tv"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: APK version for this manual build
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test search filters, playback handover and library merge
        run: |
          ./gradlew :innertube:test --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx2g
          ./gradlew :app:testMobileUniversalReleaseUnitTest --tests com.nikhil.yt.utils.ResumableUpdateDownloadTest --tests com.nikhil.yt.handover.HandoverSessionTest :app:testTvUniversalReleaseUnitTest --tests com.nikhil.yt.localsync.LibraryMergeTest --tests com.nikhil.yt.together.TogetherCoreTest --tests com.nikhil.yt.together.TogetherGuestPlaybackPlannerTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3g

      # Repository secrets are not available to pull_request workflows from forks.
      # Pushes and manual runs use the publishing key; fork PRs validate unsigned Release builds.
      - name: Prepare release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Set APK version and filename
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$MANUAL_VERSION" ]]; then
            VERSION="${MANUAL_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^(velune-testing-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            # Branch builds use the newest release tag, including after a tree recovery.
            VERSION_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            VERSION="${VERSION_TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a semantic version: MAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "RELEASE_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" == "Testing-features" || "$GITHUB_REF_NAME" == velune-testing-* ]]; then
            APK_TAG="velune-testing-v$VERSION"
          else
            APK_TAG="velune-v$VERSION"
          fi
          echo "APK_TAG=$APK_TAG" >> "$GITHUB_ENV"

      - name: Build Mobile and TV Release APKs
        env:
          REQUIRE_SIGNING: ${{ github.event_name != 'pull_request' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
            test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
            test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          fi
          ./gradlew :app:assembleMobileUniversalRelease :app:assembleTvUniversalRelease --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g

      - name: Name Release APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobileUniversal/release/*.apk "dist/$APK_TAG.apk"
          cp app/build/outputs/apk/tvUniversal/release/*.apk "dist/velune-tv-v$RELEASE_VERSION_NAME.apk"

      - name: Upload Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_TAG }}-Release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Velune ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
