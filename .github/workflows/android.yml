name: Android CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test bandwidth diagnostics and YouTube search filters
        run: ./gradlew :diagnostics:test :innertube:test --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx2g

      # Repository secrets are not available to pull_request workflows from forks.
      # PRs build Debug; pushes and manual runs build a signed Release.
      - name: Prepare release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use semantic version format vMAJOR.MINOR.PATCH (example: v1.1.3)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "RELEASE_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build Universal Release APK
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          ./gradlew :app:assembleUniversalRelease

      - name: Build Universal Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleUniversalDebug

      - name: Upload signed Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Universal-Release
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Velune ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/universal/release/*.apk

      - name: Upload Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Universal-Debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
