name: Android CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # Repository secrets are not available to pull_request workflows from forks.
      # PRs build Debug; pushes and manual runs build a signed Release.
      - name: Prepare release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Build Universal Release APK
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD repository secret" && exit 1)
          ./gradlew :app:assembleUniversalRelease

      - name: Build Universal Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleUniversalDebug

      - name: Upload signed Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Universal-Release
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Velune ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/universal/release/*.apk

      - name: Upload Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Universal-Debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
