name: Qt Quick desktop build
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-webengine-dev qtkeychain-qt6-dev libssl-dev
      - name: Compile C++ and QML
        run: |
          cmake -S desktop -B desktop/build-qml -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/build-qml --parallel 2
      - name: Check executable dependency boundaries
        run: |
          if ldd desktop/build-qml/velune | grep -E 'Qt6(WebEngine|Widgets|Multimedia|QuickWidgets)|libnode'; then exit 1; fi
          if readelf -d desktop/build-qml/native/velune-audio | grep -qi 'Qt'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: velune-qml-linux-build
          path: |
            desktop/build-qml/velune
            desktop/build-qml/velune-login
            desktop/build-qml/native/velune-audio
# Build artifacts require staged Qt/QML, Chromium and audio runtimes before use.
# CI performs compilation and dependency checks only; it does not launch Velune.
