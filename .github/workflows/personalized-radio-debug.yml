name: Personalized Radio Debug APK

on:
  push:
    branches: ["feat/personalized-radio"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personalized-radio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse Debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: velune-ui-testing-debug-keystore-v1
      - name: Test recommendations and download recovery
        run: >-
          ./gradlew :app:testMobileUniversalDebugUnitTest -PconnectTestBuildType=debug
          --tests com.nikhil.yt.utils.QuickPicksRecommenderTest
          --tests com.nikhil.yt.utils.RadioQueuePolicyTest
          --tests com.nikhil.yt.playback.DownloadedSongRecoveryTest
          --no-daemon --no-parallel --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g
      - name: Build Universal Debug APK
        run: >-
          ./gradlew :app:assembleMobileUniversalDebug
          --no-daemon --no-parallel --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g
      - name: Upload Debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Velune-personalized-radio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/mobileUniversal/debug/app-mobile-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Add download link
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Download Debug APK](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
